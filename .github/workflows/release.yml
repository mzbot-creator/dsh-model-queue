name: Release

# A tag is the release trigger: pushing v0.1.0 publishes that version and
# attaches the packed tarball. The tag and package.json version must agree, and
# the shipped lib/ must match its sources, so a release can never carry code
# that was not built from what it claims.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Refuse a tag that disagrees with package.json
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          version="v$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json ($version)" >&2
            exit 1
          fi
      - name: Full verification
        run: npm run typecheck && npm run check:dist && npm test
      - name: Pack the installable tarball
        run: npm pack --pack-destination dist
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the tarball to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
